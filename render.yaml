services:
  # ─── Backend (FastAPI) ───────────────────────────────────────────
  - type: web
    name: rankradar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rankradar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
    plan: free

  # ─── Frontend (Vite static site) ─────────────────────────────────
  - type: web
    name: rankradar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://rankradar-backend.onrender.com
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: rankradar-db
    plan: free
