services:
  # ─── Backend (FastAPI) ───────────────────────────────────────────
  - type: web
    name: rankradar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: postgresql://neondb_owner:npg_dkbL0u8ZDfIO@ep-soft-sky-athup4ym-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        sync: false # You'll be prompted to paste your Neon connection string here
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
    plan: free

  # ─── Frontend (Vite static site) ─────────────────────────────────
  - type: web
    name: rankradar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://rankradar-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
