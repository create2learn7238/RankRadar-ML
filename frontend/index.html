<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankRadar — AI Performance Intelligence Platform</title>
    <meta name="description" content="RankRadar is an ML-powered student performance intelligence platform that tracks academic marks, generates ML score predictions, and visualizes cohort analytics." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function () {
        var theme = localStorage.getItem("rankradar-theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      html, body { background: #0b0f19; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f1f5f9; color: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
